name: Minerador Production - High Performance Pipeline

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      resume:
        description: 'Resume from checkpoint'
        required: false
        default: 'true'

permissions:
  contents: read
  packages: read
  actions: write

concurrency:
  group: minerador-production
  cancel-in-progress: false

env:
  SAVE_PATH: ${{ github.workspace }}/data
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_REPO_EMAILS: Trader_Emails
  HF_REPO_CHECKPOINT: minerador_checkpoints
  LOG_LEVEL: INFO
  JOB_TIMEOUT_MINUTES: "360"
  SHUTDOWN_AT_MINUTE: "335"
  CHECKPOINT_SYNC_INTERVAL: "300"
  GRACEFUL_WAIT_AFTER_SIGTERM: "180"
  DB_UPLOAD_MAX_SIZE_MB: "1024"
  MAX_CONSECUTIVE_NO_PROGRESS: "5"

jobs:
  minerador:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      contents: read
      packages: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3-dev \
            libffi-dev \
            libssl-dev \
            pkg-config \
            jq

      - name: Increase swap space
        run: |
          set +e
          sudo swapoff -a
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          set -e

      - name: Clean up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android
          sudo apt-get clean
          df -h

      - name: Upgrade pip tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install Python dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir huggingface_hub duckdb

      - name: Verify critical packages
        run: |
          python -c "import duckdb; print('✅ duckdb OK')"
          python -c "import pandas; print('✅ pandas OK')"
          python -c "import pyarrow; print('✅ pyarrow OK')"
          python -c "from huggingface_hub import hf_hub_download; print('✅ huggingface_hub OK')"

      - name: Create data directories
        run: |
          mkdir -p "$SAVE_PATH"/exports
          mkdir -p "$SAVE_PATH"/temp
          mkdir -p "$SAVE_PATH"/raw_chunks
          mkdir -p "$SAVE_PATH"/checkpoints
          ls -la "$SAVE_PATH"

      - name: Bootstrap remote state and database
        run: python3 scripts/bootstrap.py

      - name: Check if already completed
        run: |
          STATE_FILE="$SAVE_PATH/state.json"
          if [ -f "$STATE_FILE" ]; then
            status=$(jq -r '.status // empty' "$STATE_FILE" 2>/dev/null || echo "")
            if [ "$status" = "completed" ]; then
              echo "✅ Pipeline já concluído — encerrando"
              exit 0
            fi
          fi
          echo "ℹ️ Continuando execução"

      - name: Run Minerador Production with watchdog
        timeout-minutes: 350
        env:
          PYTHONUNBUFFERED: 1
        run: |
          set -euo pipefail
          START_TS=$(date +%s)
          SHUTDOWN_TS=$((START_TS + SHUTDOWN_AT_MINUTE * 60))

          mkdir -p "$SAVE_PATH/checkpoints"

          echo "▶ Iniciando minerador_production.py"
          python minerador_production.py > "$SAVE_PATH/minerador.log" 2>&1 &
          PID=$!

          initial_metric=0
          if [ -f "$SAVE_PATH/state.json" ]; then
            initial_metric=$(jq -r '.total_emails_extracted // .total_processed // 0' "$SAVE_PATH/state.json" 2>/dev/null || echo 0)
          fi
          echo "Métrica inicial: $initial_metric"

          next_sync=$(( $(date +%s) + CHECKPOINT_SYNC_INTERVAL ))

          while kill -0 $PID 2>/dev/null; do
            now=$(date +%s)

            if [ $now -ge $next_sync ]; then
              echo "🔁 Sincronizando checkpoint..."
              python3 scripts/sync_checkpoint.py || true
              next_sync=$(( now + CHECKPOINT_SYNC_INTERVAL ))
            fi

            if [ $now -ge $SHUTDOWN_TS ]; then
              echo "⏰ Iniciando shutdown gracioso"
              kill -TERM $PID 2>/dev/null || true
              end_wait=$(( now + GRACEFUL_WAIT_AFTER_SIGTERM ))
              while kill -0 $PID 2>/dev/null && [ $(date +%s) -lt $end_wait ]; do
                sleep 1
              done
              if kill -0 $PID 2>/dev/null; then
                echo "⚠️ Forçando encerramento"
                kill -9 $PID 2>/dev/null || true
              fi
              break
            fi

            sleep 5
          done

          wait $PID 2>/dev/null || true
          echo "🛑 Processo finalizado"
          echo "$initial_metric" > "$SAVE_PATH/.initial_metric"

      - name: Finalize - upload state, checkpoints, database
        if: always()
        run: |
          initial_metric=$(cat "$SAVE_PATH/.initial_metric" 2>/dev/null || echo 0)
          python3 scripts/finalize.py all
          python3 scripts/finalize.py progress "$initial_metric"

      - name: Dispatch next run if needed
        if: always()
        run: |
          STATE_FILE="$SAVE_PATH/state.json"

          if [ ! -f "$STATE_FILE" ]; then
            echo "ℹ️ Sem state.json — não redisparando"
            exit 0
          fi

          status=$(jq -r '.status // empty' "$STATE_FILE" 2>/dev/null || echo "")
          if [ "$status" = "completed" ]; then
            echo "✅ Concluído — não redisparando"
            exit 0
          fi

          rwp=$(jq -r '.runs_without_progress // 0' "$STATE_FILE" 2>/dev/null || echo 0)

          if [ "$rwp" -le "$MAX_CONSECUTIVE_NO_PROGRESS" ]; then
            echo "▶ Disparando próxima execução..."
            curl -sS -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/main.yml/dispatches" \
              -d '{"ref":"main","inputs":{"resume":"true"}}' || echo "⚠️ Falha no dispatch"
          else
            echo "⛔ Limite de tentativas sem progresso excedido — não redisparando"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Display logs (last 200 lines)
        if: always()
        run: |
          if [ -f "$SAVE_PATH/minerador.log" ]; then
            echo "=== MINERADOR LOG ==="
            tail -200 "$SAVE_PATH/minerador.log"
          fi

      - name: Show disk usage
        if: always()
        run: |
          echo "=== DISK USAGE ==="
          df -h
          echo ""
          echo "=== DATA DIRECTORY ==="
          if [ -d "$SAVE_PATH" ]; then
            du -sh "$SAVE_PATH"/* 2>/dev/null || true
          fi

      - name: Clean temporary files
        if: always()
        run: |
          if [ -d "$SAVE_PATH" ]; then
            rm -rf "$SAVE_PATH"/temp
            rm -rf "$SAVE_PATH"/raw_chunks/*.parquet
            du -sh "$SAVE_PATH"
          fi

      - name: Status summary
        if: always()
        run: |
          echo "✅ Workflow completed"
          echo "📁 Data: $SAVE_PATH"
          if [ -f "$SAVE_PATH/state.json" ]; then
            echo "✅ State persisted for next run"
          fi
