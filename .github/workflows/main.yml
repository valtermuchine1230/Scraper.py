            echo "ℹ️ DuckDB found: ${size_mb} MB"
            if [ $size_mb -le $DB_UPLOAD_MAX_SIZE_MB ]; then
              echo "📤 Attempting DuckDB upload (size ${size_mb}MB <= ${DB_UPLOAD_MAX_SIZE_MB}MB)"
