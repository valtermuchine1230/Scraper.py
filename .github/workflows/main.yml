                    d = json.load(f)
                    if d.get("status") == "completed":
                        completed += 1
            except Exception:
                continue
    print("DOMAINS_TOTAL:", len(domains), "CHECKPOINTS_COMPLETED:", completed)
    with open(os.path.join(save_path, ".__completion_eval__.json"), "w") as f:
        json.dump({"domains_total": len(domains), "checkpoints_completed": completed}, f)
except Exception as e:
    print("ℹ️ DuckDB inference failed:", e)
    with open(os.path.join(save_path, ".__completion_eval__.json"), "w") as f:
