if os.path.isdir(cp_dir):
    for fn in os.listdir(cp_dir):
        local = os.path.join(cp_dir, fn)
        if os.path.isfile(local):
            try:
                api.upload_file(path_or_fileobj=local, path_in_repo=f"checkpoints/{fn}", repo_id=checkpoint_repo, repo_type="dataset", token=token)
                print("✅ uploaded:", fn)
            except Exception as e:
                print("⚠️ checkpoint upload failed for", fn, e)
PY
          }

          last_state_hash_file="${SAVE_PATH}/.last_state_hash"
          compute_state_hash() {
            if [ -f "${SAVE_PATH}/state.json" ]; then
              sha256sum "${SAVE_PATH}/state.json" | awk '{print $1}'
            else
              echo ""
            fi
          }

          echo "▶ Starting minerador_production.py (pid saved)"
          cd repo-${{ github.run_id }}
          python minerador_production.py &
          PID=$!
          echo "PID=$PID"

          initial_metric=0
          if [ -f "${SAVE_PATH}/state.json" ]; then
            initial_metric=$(jq -r '.total_emails_extracted // .total_processed // (.processed_tars | length) // 0' "${SAVE_PATH}/state.json" || echo 0)
          fi
          echo "Initial progress metric: $initial_metric"

          next_sync=$(( $(date +%s) + CHECKPOINT_SYNC_INTERVAL ))
          while kill -0 $PID 2>/dev/null; do
            now=$(date +%s)
            if [ $now -ge $next_sync ]; then
              new_hash=$(compute_state_hash)
              old_hash=""
              if [ -f "$last_state_hash_file" ]; then old_hash=$(cat "$last_state_hash_file"); fi
              if [ -n "$new_hash" ] && [ "$new_hash" != "$old_hash" ]; then
                echo "🔁 state.json changed: uploading checkpoint..."
                hf_upload_state_and_checkpoints
                echo "$new_hash" > "$last_state_hash_file" || true
              else
                echo "ℹ️ No state.json change detected or missing."
              fi
              next_sync=$(( now + CHECKPOINT_SYNC_INTERVAL ))
            fi

            if [ $now -ge $SHUTDOWN_TS ]; then
              echo "⏰ Shutdown threshold reached (5h35) — initiating graceful shutdown"
              kill -TERM "$PID" 2>/dev/null || true
              end_wait=$(( now + GRACEFUL_WAIT ))
              while kill -0 $PID 2>/dev/null && [ $(date +%s) -lt $end_wait ]; do
                sleep 1
              done
              if kill -0 $PID 2>/dev/null; then
                echo "⚠️ Process did not exit within graceful window — force kill"
                kill -KILL "$PID" 2>/dev/null || true
              fi
              break
            fi
            sleep 5
          done

          wait $PID || true
          echo "🛑 Minerador process ended. Performing final uploads & verification..."

          hf_upload_state_and_checkpoints

          DB_PATH="${SAVE_PATH}/emails.duckdb"
          if [ -f "$DB_PATH" ]; then
            size_bytes=$(stat -c%s "$DB_PATH" || echo 0)
