name: Minerador Production - High Performance Pipeline

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      resume:
        description: 'Resume from checkpoint'
        required: false
        default: 'true'

permissions:
  contents: read
  packages: read
  actions: write

concurrency:
  group: minerador-production
  cancel-in-progress: false

env:
  JOB_TIMEOUT_MINUTES: "360"
  SHUTDOWN_AT_MINUTE: "335"
  CHECKPOINT_SYNC_INTERVAL: "300"
  GRACEFUL_WAIT_AFTER_SIGTERM: "180"
  DB_UPLOAD_MAX_SIZE_MB: "1024"
  MAX_CONSECUTIVE_NO_PROGRESS: "5"
  SAVE_PATH_BASE: "${{ runner.temp }}/data-${{ github.run_id }}"
  HF_REPO_EMAILS: "Trader_Emails"
  HF_REPO_CHECKPOINT: "minerador_checkpoints"

jobs:
  minerador:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: read
      actions: write
    env:
      SAVE_PATH: ${{ env.SAVE_PATH_BASE }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: repo-${{ github.run_id }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential python3-dev libffi-dev libssl-dev pkg-config jq

      - name: Increase swap space
        run: |
          set +e
          sudo swapoff -a
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          set -e

      - name: Install Python dependencies
        working-directory: repo-${{ github.run_id }}
        run: |
          python -m pip install --upgrade pip setuptools wheel -q
          if [ -f requirements.txt ]; then
            pip install --no-cache-dir -r requirements.txt -q
          fi
          pip install --no-cache-dir huggingface_hub duckdb -q

      - name: Prepare directories
        run: |
          mkdir -p "${{ env.SAVE_PATH }}/exports"
          mkdir -p "${{ env.SAVE_PATH }}/temp"
          mkdir -p "${{ env.SAVE_PATH }}/raw_chunks"
          mkdir -p "${{ env.SAVE_PATH }}/checkpoints"
          ls -la "${{ env.SAVE_PATH }}"

      - name: Bootstrap remote state and database
        working-directory: repo-${{ github.run_id }}
        run: python3 scripts/bootstrap.py

      - name: Check if already completed
        run: |
          STATE_FILE="${{ env.SAVE_PATH }}/state.json"
          if [ -f "$STATE_FILE" ]; then
            status=$(jq -r '.status // empty' "$STATE_FILE" 2>/dev/null || echo "")
            if [ "$status" = "completed" ]; then
              echo "✅ Pipeline já concluído — encerrando"
              exit 0
            fi
          fi
          echo "ℹ️ Continuando execução"

      - name: Run minerador with watchdog
        working-directory: repo-${{ github.run_id }}
        timeout-minutes: 350
        run: |
          set -euo pipefail
          SAVE_PATH="${{ env.SAVE_PATH }}"
          START_TS=$(date +%s)
          SHUTDOWN_TS=$((START_TS + ${{ env.SHUTDOWN_AT_MINUTE }} * 60))
          CHECKPOINT_SYNC_INTERVAL=${{ env.CHECKPOINT_SYNC_INTERVAL }}
          GRACEFUL_WAIT=${{ env.GRACEFUL_WAIT_AFTER_SIGTERM }}

          mkdir -p "${SAVE_PATH}/checkpoints"

          echo "▶ Iniciando minerador_production.py"
          python3 minerador_production.py > "${SAVE_PATH}/minerador.log" 2>&1 &
          PID=$!

          initial_metric=0
          if [ -f "${SAVE_PATH}/state.json" ]; then
            initial_metric=$(jq -r '.total_emails_extracted // .total_processed // 0' "${SAVE_PATH}/state.json" 2>/dev/null || echo 0)
          fi
          echo "Métrica inicial: $initial_metric"

          next_sync=$(( $(date +%s) + CHECKPOINT_SYNC_INTERVAL ))

          while kill -0 $PID 2>/dev/null; do
            now=$(date +%s)

            if [ $now -ge $next_sync ]; then
              echo "🔁 Sincronizando checkpoint..."
              python3 scripts/sync_checkpoint.py || true
              next_sync=$(( now + CHECKPOINT_SYNC_INTERVAL ))
            fi

            if [ $now -ge $SHUTDOWN_TS ]; then
              echo "⏰ Iniciando shutdown gracioso"
              kill -TERM $PID 2>/dev/null || true
              end_wait=$(( now + GRACEFUL_WAIT ))
              while kill -0 $PID 2>/dev/null && [ $(date +%s) -lt $end_wait ]; do
                sleep 1
              done
              if kill -0 $PID 2>/dev/null; then
                echo "⚠️ Forçando encerramento"
                kill -9 $PID 2>/dev/null || true
              fi
              break
            fi

            sleep 5
          done

          wait $PID 2>/dev/null || true
          echo "🛑 Processo finalizado"

          echo "$initial_metric" > "${SAVE_PATH}/.initial_metric"

      - name: Finalize - upload state, checkpoints, database
        if: always()
        working-directory: repo-${{ github.run_id }}
        run: |
          initial_metric=$(cat "${{ env.SAVE_PATH }}/.initial_metric" 2>/dev/null || echo 0)
          python3 scripts/finalize.py all
          python3 scripts/finalize.py progress "$initial_metric"

      - name: Dispatch next run if needed
        if: always()
        run: |
          SAVE_PATH="${{ env.SAVE_PATH }}"
          STATE_FILE="$SAVE_PATH/state.json"

          if [ ! -f "$STATE_FILE" ]; then
            echo "ℹ️ Sem state.json — não redisparando"
            exit 0
          fi

          status=$(jq -r '.status // empty' "$STATE_FILE" 2>/dev/null || echo "")
          if [ "$status" = "completed" ]; then
            echo "✅ Concluído — não redisparando"
            exit 0
          fi

          rwp=$(jq -r '.runs_without_progress // 0' "$STATE_FILE" 2>/dev/null || echo 0)
          max_no_progress=${{ env.MAX_CONSECUTIVE_NO_PROGRESS }}

          if [ "$rwp" -le "$max_no_progress" ]; then
            echo "▶ Disparando próxima execução..."
            curl -sS -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/main.yml/dispatches" \
              -d '{"ref":"main","inputs":{"resume":"true"}}' || echo "⚠️ Falha no dispatch"
          else
            echo "⛔ Limite de tentativas sem progresso excedido — não redisparando"
          fi

      - name: Show logs
        if: always()
        run: |
          LOGFILE="${{ env.SAVE_PATH }}/minerador.log"
          if [ -f "$LOGFILE" ]; then
            echo "=== ÚLTIMAS 150 LINHAS DO LOG ==="
            tail -150 "$LOGFILE"
          fi

      - name: Disk usage report
        if: always()
        run: |
          echo "=== USO DE DISCO ==="
          df -h /
          echo ""
          echo "=== DIRETÓRIO DE DADOS ==="
          du -sh "${{ env.SAVE_PATH }}"/* 2>/dev/null || echo "Sem dados ainda"
