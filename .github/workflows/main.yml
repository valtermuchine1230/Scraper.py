import os, json
import duckdb
save_path = os.environ.get("SAVE_PATH")
db = duckdb.connect(os.path.join(save_path, "emails.duckdb"))
try:
    rows = db.execute("""
        SELECT LOWER(SUBSTR(email, POSITION('@' IN email) + 1)) AS domain,
               COUNT(*) AS cnt
        FROM emails_raw
        GROUP BY domain
