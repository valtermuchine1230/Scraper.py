name: Minerador Production - High Performance Pipeline

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      resume:
        description: 'Resume from checkpoint'
        required: false
        default: 'true'

permissions:
  contents: read
  packages: read
  actions: write

concurrency:
  group: minerador-production
  cancel-in-progress: false

env:
  JOB_TIMEOUT_MINUTES: "360"
  SHUTDOWN_AT_MINUTE: "335"
  CHECKPOINT_SYNC_INTERVAL: "300"
  GRACEFUL_WAIT_AFTER_SIGTERM: "180"
  DB_UPLOAD_MAX_SIZE_MB: "1024"
  MAX_CONSECUTIVE_NO_PROGRESS: "5"
  HF_REPO_EMAILS: "Trader_Emails"
  HF_REPO_CHECKPOINT: "minerador_checkpoints"
  LOG_LEVEL: "INFO"

jobs:
  minerador:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      contents: read
      packages: read
      actions: write

    env:
      SAVE_PATH: ${{ runner.temp }}/data-${{ github.run_id }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WORKFLOW_FILE: .github/workflows/main.yml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: repo-${{ github.run_id }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install system dependencies (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev libffi-dev libssl-dev pkg-config

      - name: Increase swap space (best-effort)
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /swapfile || true
          sudo chmod 600 /swapfile || true
          sudo mkswap /swapfile || true
          sudo swapon /swapfile || true
          free -h || true

      - name: Install Python dependencies (from requirements.txt)
        working-directory: repo-${{ github.run_id }}
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f requirements.txt ]; then
            pip install --no-cache-dir -r requirements.txt
          fi

      - name: Prepare SAVE_PATH and directories
        run: |
          mkdir -p "${{ env.SAVE_PATH }}/exports"
          mkdir -p "${{ env.SAVE_PATH }}/temp"
          mkdir -p "${{ env.SAVE_PATH }}/raw_chunks"
          mkdir -p "${{ env.SAVE_PATH }}/checkpoints"
          ls -la "${{ env.SAVE_PATH }}"

      - name: Bootstrap: download remote state.json and (conditionally) emails.duckdb from HF
        working-directory: repo-${{ github.run_id }}
        env:
          SAVE_PATH: ${{ env.SAVE_PATH }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_CHECKPOINT: ${{ env.HF_REPO_CHECKPOINT }}
          HF_REPO_EMAILS: ${{ env.HF_REPO_EMAILS }}
          DB_UPLOAD_MAX_SIZE_MB: ${{ env.DB_UPLOAD_MAX_SIZE_MB }}
        run: |
          python - <<'PY'
import os
from huggingface_hub import HfApi, hf_hub_download
api = HfApi()
token = os.environ.get("HF_TOKEN")
repo_owner = None
try:
    who = api.whoami(token=token)
    repo_owner = who.get("name") or who.get("user")
except Exception as e:
    print("⚠️ HF whoami failed:", e)
checkpoint_repo = f"{repo_owner}/{os.environ.get('HF_REPO_CHECKPOINT')}" if repo_owner else os.environ.get('HF_REPO_CHECKPOINT')
save_path = os.environ.get("SAVE_PATH")
try:
    hf_hub_download(repo_id=checkpoint_repo, filename="state.json", local_dir=save_path, token=token, repo_type="dataset")
    print("✅ state.json downloaded")
except Exception as e:
    print("ℹ️ No remote state.json or download error:", e)
try:
    files = api.list_repo_files(repo_id=checkpoint_repo, token=token, repo_type="dataset")
    if "emails.duckdb" in files:
        try:
            hf_hub_download(repo_id=checkpoint_repo, filename="emails.duckdb", local_dir=save_path, token=token, repo_type="dataset")
            print("✅ DuckDB downloaded")
        except Exception as e:
            print("⚠️ DuckDB download skipped or failed:", e)
    else:
        print("ℹ️ No emails.duckdb in checkpoint repo")
except Exception as e:
    print("ℹ️ Could not list checkpoint repo files:", e)
PY

      - name: Check remote state for COMPLETED (and exit early if completed)
        shell: bash
        run: |
          set -euo pipefail
          STATE_FILE="${{ env.SAVE_PATH }}/state.json"
          if [ -f "$STATE_FILE" ]; then
            status=$(jq -r '.status // empty' "$STATE_FILE" || echo "")
            if [ "$status" = "completed" ]; then
              echo "✅ Remote state reports status=completed — stopping early."
              exit 0
            fi
          fi
          echo "ℹ️ Not completed — continuing."

      - name: Run minerador with watchdog (periodic checkpoint sync + graceful shutdown + final persistence)
        working-directory: repo-${{ github.run_id }}
        env:
          SAVE_PATH: ${{ env.SAVE_PATH }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_CHECKPOINT: ${{ env.HF_REPO_CHECKPOINT }}
          HF_REPO_EMAILS: ${{ env.HF_REPO_EMAILS }}
          CHECKPOINT_SYNC_INTERVAL: ${{ env.CHECKPOINT_SYNC_INTERVAL }}
          SHUTDOWN_AT_MINUTE: ${{ env.SHUTDOWN_AT_MINUTE }}
          GRACEFUL_WAIT_AFTER_SIGTERM: ${{ env.GRACEFUL_WAIT_AFTER_SIGTERM }}
          DB_UPLOAD_MAX_SIZE_MB: ${{ env.DB_UPLOAD_MAX_SIZE_MB }}
          MAX_CONSECUTIVE_NO_PROGRESS: ${{ env.MAX_CONSECUTIVE_NO_PROGRESS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_FILE: ${{ env.WORKFLOW_FILE }}
        run: |
          set -euo pipefail
          SAVE_PATH="${SAVE_PATH}"
          START_TS=$(date +%s)
          SHUTDOWN_AT_MINUTE=${SHUTDOWN_AT_MINUTE}
          SHUTDOWN_TS=$((START_TS + SHUTDOWN_AT_MINUTE * 60))
          CHECKPOINT_SYNC_INTERVAL=${CHECKPOINT_SYNC_INTERVAL:-300}
          GRACEFUL_WAIT=${GRACEFUL_WAIT_AFTER_SIGTERM:-180}
          DB_UPLOAD_MAX_SIZE_MB=${DB_UPLOAD_MAX_SIZE_MB:-1024}
          MAX_NO_PROGRESS=${MAX_CONSECUTIVE_NO_PROGRESS:-5}

          mkdir -p "${SAVE_PATH}/checkpoints"

          hf_upload_state_and_checkpoints() {
            python - <<'PY'
import os
from huggingface_hub import HfApi
api = HfApi()
token = os.environ.get("HF_TOKEN")
